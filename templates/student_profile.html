<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .photo-holder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .photo-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 8px;
        }

        td:first-child {
            text-align: right;
            vertical-align: top;
            width: 40%;
        }

        td:last-child {
            text-align: left;
            width: 60%;
        }

        h1, h2 {
            text-align: center;
        }

        input[type="file"] {
            margin-bottom: 10px;
        }

        button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Profile</h1>

        <!-- Profile Photo -->
        <div class="photo-holder">
            <img src="{{ student.photo_url or '/static/default-photo.png' }}" alt="Student Photo" width="150" height="150">
        </div>

        <!-- Upload New Photo -->
        <form method="POST" action="{{ url_for('upload_student_photo') }}" enctype="multipart/form-data">
            <input type="hidden" name="student_id" value="{{ student.id }}">
            <input type="file" name="photo">
            <button type="submit">Upload Photo</button>
        </form>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <p style="color: red;">{{ messages[0] }}</p>
        {% endif %}
        {% endwith %}


        <hr>

        <!-- Student Info -->
        <h2>Student Profile</h2>
        <form method="POST" action="/save-profile">
            <input type="hidden" name="student_id" value="{{ student.student_id }}">
            <table>
                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input type="text" id="name" name="student_name" value="{{ student.name }}" required></td>
                </tr>
                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td><input type="text" id="phone" name="phone" value="{{ student.phone }}" required></td>
                </tr>
                <tr>
                    <td><label for="grade">Grade:</label></td>
                    <td><input type="text" id="grade" name="grade" value="{{ student.grade }}" required></td>
                </tr>
                <tr>
                    <td><label for="section">Section:</label></td>
                    <td><input type="text" id="section" name="section" value="{{ student.group }}" required></td>
                </tr>
                <tr>
                    <td><label for="school">School:</label></td>
                    <td><input type="text" id="school" name="school" value="{{ student.school }}" required></td>
                </tr>
            </table>
            <div style="text-align:center; margin-top: 20px;">
                <button type="submit">Save Profile</button>
            </div>
        </form>
        <br>
        <div class="sub-container-below">
            <a href="{{ url_for('view_children') }}" class="back-button">Back to Children List</a>
        </div>
    </div>
</body>

</html>
