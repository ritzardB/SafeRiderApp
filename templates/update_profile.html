<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Parent's Profile</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="main-container">
        <div class="sub-container-1">
            <img src="/static/saferider.png" width="250" height="160" alt="SafeRider Logo">
            <h1>Update Parent's Profile</h1>
        </div>
        <div>
            <form method="POST">
                <table>
                    <tr>
                        <td><label for="parent_name">Parent Name:</label></td>
                        <td><input type="text" name="parent_name" value="{{ parent.parent_name }}" required></td>
                    </tr>
                    <tr>
                        <td><label for="phone">Phone:</label></td>
                        <td><input type="text" name="phone" value="{{ parent.phone }}" required></td>
                    </tr>
                    <tr>
                        <td><label for="home_address">Home Address:</label></td>
                        <td><input type="text" name="home_address" value="{{ parent.home_address }}" required></td>
                </table>

                <button type="submit">Update</button>
                </form>
        <p>Note: The assigned driver will be notified of the updated profile.</p>       
        </div>

        <div>
            <a href="/parent_profile" class="back-button">Back to Profile</a>
        </div>
    </div>
    
</body>
</html>
